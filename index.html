<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Academic profile of Junseo Park, graduate researcher at UNIST.">
  <title>Junseo Park | Research</title>
  <style>
    :root {
      color-scheme: light;
      font: 100%/1.6 system-ui, sans-serif;
      color: #172c31;
      background: #f8f7f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2.5rem, 50rem); margin: auto; }
    .hero { padding: clamp(3rem, 11vw, 8rem) 0 3rem; }
    .label {
      margin: 0 0 1rem;
      color: #235c56;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1, h2 { font-family: Georgia, serif; font-weight: 400; line-height: 1.1; }
    h1 { margin: 0 0 1rem; font-size: clamp(3.2rem, 10vw, 6.4rem); letter-spacing: -.055em; }
    h2 { margin: 0 0 .75rem; font-size: 1.8rem; }
    .affiliation { margin: 0; font-size: clamp(.98rem, 2.5vw, 1.15rem); }
    .affiliation + .affiliation { margin-top: .2rem; }
    .details {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 2.5rem;
      padding: 2rem 0 3.5rem;
      border-top: 1px solid #a4b8b0;
    }
    .details p { margin: 0; max-width: 37ch; color: #40575a; }
    a { color: #175b54; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #175b54; outline-offset: 4px; }
    @media (max-width: 38rem) {
      .details { grid-template-columns: 1fr; gap: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="label">Academic profile</p>
      <h1>Junseo Park</h1>
      <p class="affiliation">Graduate Researcher · UNIST</p>
      <p class="affiliation">High-Impact Weather Prediction Laboratory (HWPL)</p>
    </header>
    <div class="details">
      <section aria-labelledby="research">
        <h2 id="research">Research</h2>
        <p>I work on regional climate modeling and contribute to CORDEX activities.</p>
      </section>
      <section aria-labelledby="profiles">
        <h2 id="profiles">CV &amp; academic profiles</h2>
        <p>My CV, research projects, and academic profile links will be added here.</p>
        <!-- Add verified links to the CV, lab website, Google Scholar, ORCID, and ResearchGate here. -->
      </section>
    </div>
  </main>
</body>
</html>
